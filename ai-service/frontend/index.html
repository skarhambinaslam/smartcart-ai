<!DOCTYPE html>
<html>
<head>
     <meta charset="UTF-8">
    <title>SmartCart AI</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .box {
            width: 60%;
            margin: auto;
            margin-top: 30px;
        }

        input {
            width: 70%;
            padding: 12px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            margin: 5px;
            background: #2563eb;
            color: white;
        }

        .result {
            margin-top: 20px;
            text-align: left;
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            min-height: 300px;
        }

        .card {
            background: #334155;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
        }

        .user {
            text-align: right;
            margin: 8px;
        }

        .ai {
            text-align: left;
            margin: 8px;
        }

        .bubble {
            display: inline-block;
            padding: 10px;
            border-radius: 10px;
            max-width: 70%;
        }

        .user .bubble {
            background: #2563eb;
        }

        .ai .bubble {
            background: #334155;
        }

        img {
            border-radius: 8px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🧠 SmartCart AI</h1>

    <input id="msg" placeholder="Type: gaming laptop chahiye">
    <button onclick="send()">Ask AI</button>
    <button onclick="showCart()">🧾 Cart</button>

    <div id="output" class="result"></div>

</div>

<script>

let chatHistory = [];
let cart = [];

async function send() {

    let message = document.getElementById("msg").value;

    chatHistory.push({ role: "user", text: message });

    document.getElementById("output").innerHTML = "🤖 Thinking...";

    let res = await fetch("http://10.0.10.29:7000/analyze", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: message })
    });

    let data = await res.json();

    chatHistory.push({ role: "ai", text: data.reply });

    render(data);
}

function render(data) {

    let html = "";

    // 💬 CHAT HISTORY
    chatHistory.forEach(c => {

        if (c.role === "user") {
            html += `
                <div class="user">
                    <div class="bubble">${c.text}</div>
                </div>
            `;
        } else {
            html += `
                <div class="ai">
                    <div class="bubble">${c.text}</div>
                </div>
            `;
        }
    });

    // 🛒 PRODUCTS
    html += "<h3>🛒 Suggestions</h3>";

    data.suggestions.forEach(p => {
        html += `
            <div class="card">
                <img src="https://via.placeholder.com/120"><br>
                <b>${p.name}</b><br>
                💰 ${p.price}<br>
                <button onclick='addToCart("${p.name}", ${p.price})'>Add to Cart</button>
            </div>
        `;
    });

    document.getElementById("output").innerHTML = html;
}

function addToCart(name, price) {
    cart.push({ name, price });
    alert(name + " added to cart 🛒");
}

function showCart() {

    let total = 0;
    let html = "<h2>🧾 Your Cart</h2>";

    cart.forEach(item => {
        total += item.price;
        html += `<p>${item.name} - 💰 ${item.price}</p>`;
    });

    html += `<h3>💰 Total: ${total}</h3>`;

    document.getElementById("output").innerHTML = html;
}

</script>

</body>
</html>
